<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>dusk — a procedural flythrough</title>
<style>
  :root{
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ease-in-out:cubic-bezier(.77,0,.175,1);
    --ink:rgba(255,255,255,.80);
    --dim:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#04050a;overflow:hidden;color:var(--ink);
    font:500 11px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  body.idle{cursor:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .mark{
    position:fixed;top:18px;left:20px;font-size:10px;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;
    transition:opacity 1200ms var(--ease-out) 700ms;pointer-events:none;
  }
  body.started .mark{opacity:1}
  .hint{
    position:fixed;left:50%;bottom:clamp(22px,6vh,54px);
    transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:9px;
    text-align:center;pointer-events:none;
    transition:opacity 460ms var(--ease-out),filter 460ms var(--ease-out),transform 460ms var(--ease-out);
    will-change:opacity,filter,transform;
  }
  .hint.gone{opacity:0;filter:blur(5px);transform:translateX(-50%) translateY(7px)}
  .pulse{
    width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.9);
    box-shadow:0 0 0 0 rgba(255,255,255,.35);
    animation:pulse 2600ms var(--ease-in-out) infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.85;box-shadow:0 0 10px 1px rgba(255,214,170,.55)}
    50%{opacity:.35;box-shadow:0 0 2px 0 rgba(255,214,170,.2)}
  }
  .label{font-size:11px;letter-spacing:.30em;text-transform:uppercase;color:var(--ink)}
  .sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .err{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:44ch;
    text-align:center;color:#ffb3b3;font-size:12px;line-height:1.7;letter-spacing:.02em;
  }
  @media (prefers-reduced-motion:reduce){
    .pulse{animation:none;opacity:.7}
    .hint{transition:opacity 300ms ease}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="mark">dusk</div>
<div class="hint" id="hint">
  <span class="pulse" aria-hidden="true"></span>
  <span class="label">click to begin</span>
  <span class="sub">sound on &middot; move to look &middot; scroll to speed</span>
</div>
<div class="err" id="err" hidden></div>
<script>
(() => {
"use strict";

const canvas = document.getElementById("c");
const hint   = document.getElementById("hint");
const errBox = document.getElementById("err");

const params = new URLSearchParams(location.hash.slice(1));
const tSkip = parseFloat(params.get("t") || "0") || 0;
const duskForce = params.has("dusk") ? Math.min(1, Math.max(0, parseFloat(params.get("dusk")))) : null;

function fail(msg){
  errBox.hidden = false;
  errBox.textContent = msg;
}
window.addEventListener("error", e => { if (!errBox.textContent) fail("error: " + e.message); });

const glOpts = {alpha:false, antialias:false, depth:false, stencil:false, preserveDrawingBuffer:false, powerPreference:"high-performance"};
const gl = canvas.getContext("webgl", glOpts) || canvas.getContext("experimental-webgl", glOpts);
if (!gl){ fail("WebGL isn't available in this browser."); return; }

const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform float uDusk;
uniform float uIntro;
uniform vec3  uCam;
uniform vec3  uFwd;
uniform vec3  uRight;
uniform vec3  uUp;
uniform vec3  uSun;

const float PER  = 8192.0;
const float F1   = 0.00390625;
const float WAT  = -2.0;
const float TMAX = 420.0;
const float FAR  = 0.55431;

float hash21(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031 + 0.107);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z * 0.001);
}

float vn(vec2 p, float cells){
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  vec2 i0 = mod(i, cells);
  vec2 i1 = mod(i + 1.0, cells);
  float a = hash21(vec2(i0.x, i0.y));
  float b = hash21(vec2(i1.x, i0.y));
  float c = hash21(vec2(i0.x, i1.y));
  float d = hash21(vec2(i1.x, i1.y));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec2 wrap2(vec2 p){ return mod(p + 4096.0, PER) - 4096.0; }

float terrain(vec2 p){
  vec2 c = wrap2(p) * F1;
  float h = vn(c, 32.0) * 12.0;
  c = vec2(-c.y, c.x) * 2.0;
  h += vn(c, 64.0) * 7.0;
  c = vec2(c.y, -c.x) * 2.0;
  h += vn(c, 128.0) * 4.5;
  c = vec2(-c.y, c.x) * 2.0;
  h += vn(c, 256.0) * 2.4;
  return h - 6.0;
}

vec3 skyTone(vec3 rd, float dusk){
  float hz = exp(-max(rd.y, 0.0) * 14.0);
  vec3 top = mix(vec3(0.024, 0.050, 0.175), vec3(0.003, 0.006, 0.026), dusk);
  vec3 hor = mix(vec3(0.70, 0.235, 0.082),   vec3(0.040, 0.034, 0.068), dusk);
  return mix(top, hor, hz);
}

vec3 sunGlow(vec3 rd, vec3 sun, float dusk){
  float sd = max(dot(rd, sun), 0.0);
  vec3 c = mix(vec3(1.10, 0.50, 0.20), vec3(0.16, 0.20, 0.42), dusk);
  return c * (pow(sd, 48.0) * 2.4 + pow(sd, 10.0) * 0.14 * exp(-max(rd.y, 0.0) * 5.0)) * (1.0 - 0.80 * dusk);
}

vec3 starField(vec3 rd, float dusk){
  float vis = smoothstep(0.40, 0.95, dusk) * smoothstep(0.0, 0.16, rd.y);
  if (vis <= 0.001) return vec3(0.0);
  vec2 sp = vec2(atan(rd.x, rd.z), asin(clamp(rd.y, -1.0, 1.0))) * 130.0;
  vec2 id = floor(sp);
  vec2 f  = fract(sp) - 0.5;
  float h = hash21(id);
  if (h < 0.952) return vec3(0.0);
  vec2 off = (vec2(hash21(id + 5.3), hash21(id + 9.1)) - 0.5) * 0.76;
  vec2 dv = f - off;
  float core = exp(-dot(dv, dv) * clamp(pow(uRes.y * 0.0066, 2.0), 6.0, 90.0));
  float tw = 0.55 + 0.45 * sin(uTime * (0.9 + 1.7 * h) + h * 61.0);
  float br = 0.30 + 0.70 * fract(h * 41.7);
  vec3 tint = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.88, 0.72), fract(h * 17.3));
  return tint * core * tw * br * vis * 2.6;
}

vec3 skyFull(vec3 rd, vec3 sun, float dusk){
  vec3 col = skyTone(rd, dusk) + sunGlow(rd, sun, dusk);
  float sd = max(dot(rd, sun), 0.0);
  col += smoothstep(0.9999785, 0.9999885, sd) * mix(vec3(2.6, 1.05, 0.45), vec3(0.55, 0.45, 0.65), dusk) * (1.0 - 0.75 * dusk);

  if (rd.y > 0.004){
    vec2 cuv = clamp(rd.xz / max(rd.y, 0.055), -26.0, 26.0);
    cuv += vec2(uTime * 0.010, uTime * 0.004);
    float n = vn(cuv, 32000.0) * 0.62 + vn(cuv * 2.31 + 19.3, 32000.0) * 0.38;
    float d = smoothstep(0.44, 0.80, n) * smoothstep(0.012, 0.12, rd.y);
    vec3 lit = mix(vec3(0.10, 0.12, 0.18), vec3(0.78, 0.38, 0.22), clamp(0.10 + 0.90 * sd * sd, 0.0, 1.0));
    lit *= mix(0.30, 1.0, smoothstep(0.02, 0.34, rd.y)) * mix(1.0, 0.13, dusk);
    col = mix(col, lit, d * 0.55);
  }
  return col + starField(rd, dusk);
}

vec3 shadeGround(vec3 p, vec3 rd, float t, vec3 sun, float dusk){
  float e = 0.22 + t * 0.012;
  float hx = terrain(p.xz + vec2(e, 0.0)) - terrain(p.xz - vec2(e, 0.0));
  float hz = terrain(p.xz + vec2(0.0, e)) - terrain(p.xz - vec2(0.0, e));
  vec3 n = normalize(vec3(-hx, 2.0 * e, -hz));

  float flt = smoothstep(0.45, 0.88, n.y);
  float grain = vn(wrap2(p.xz) * 0.5, 4096.0);
  vec3 alb = mix(vec3(0.200, 0.150, 0.095), vec3(0.100, 0.140, 0.075), flt * (0.62 + 0.52 * grain));
  float snow = smoothstep(7.0, 10.5, p.y) * smoothstep(0.42, 0.78, n.y);
  alb = mix(alb, vec3(0.86, 0.90, 0.98), snow);

  float ndl = max(dot(n, sun), 0.0);
  vec3 sunCol = mix(vec3(1.45, 0.78, 0.42), vec3(0.10, 0.13, 0.26), dusk);
  vec3 col = alb * sunCol * ndl * 2.4;

  vec3 amb = mix(vec3(0.26, 0.32, 0.44), vec3(0.034, 0.046, 0.088), dusk);
  col += alb * amb * (0.38 + 0.62 * n.y);

  vec3 moon = normalize(vec3(-0.60, 0.45, 0.66));
  col += alb * vec3(0.22, 0.27, 0.46) * max(dot(n, moon), 0.0) * smoothstep(0.45, 1.0, dusk);

  float rim = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
  col += sunCol * rim * ndl * 0.35;
  return col;
}

vec3 shadeWater(vec3 p, vec3 rd, vec3 sun, float dusk){
  vec2 rp = mod(p.xz * 1.35 + vec2(uTime * 0.045, uTime * 0.028), 1024.0);
  float n1 = vn(rp, 1024.0);
  float n2 = vn(rp * 1.9 + 27.0, 2048.0);
  vec3 n = normalize(vec3((n1 - 0.5) * 0.55, 1.0, (n2 - 0.5) * 0.55));

  float fres = 0.02 + 0.98 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  vec3 refl = skyFull(reflect(rd, n), sun, dusk) * 0.95;
  vec3 deep = mix(vec3(0.020, 0.045, 0.060), vec3(0.004, 0.008, 0.018), dusk);
  vec3 col = mix(deep, refl, clamp(fres, 0.0, 1.0));

  vec3 rfl = reflect(rd, n);
  float s = max(dot(rfl, sun), 0.0);
  col += mix(vec3(1.2, 0.75, 0.45), vec3(0.4, 0.45, 0.7), dusk) * (pow(s, 1400.0) * 8.0 + pow(s, 90.0) * 0.30) * (1.0 - 0.6 * dusk);
  return col;
}

vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 rd = normalize(uFwd + uRight * (uv.x * 2.0 * FAR) + uUp * (uv.y * 2.0 * FAR));

  float t = 0.5;
  float hit = -1.0;
  float prev = 0.0;

  if (rd.y < 0.045){
    for (int i = 0; i < 90; i++){
      vec3 p = uCam + rd * t;
      float d = p.y - terrain(p.xz);
      if (d < 0.0){ hit = t; break; }
      if (p.y > 24.0 && rd.y > 0.0) break;
      prev = t;
      t += max(0.6 + t * 0.012, d * 0.45);
      if (t > TMAX) break;
    }
  }

  if (hit > 0.0){
    float a = prev, b = hit;
    for (int i = 0; i < 5; i++){
      float m = 0.5 * (a + b);
      vec3 pm = uCam + rd * m;
      if (pm.y - terrain(pm.xz) < 0.0) b = m; else a = m;
    }
    hit = 0.5 * (a + b);
  }

  float tw = -1.0;
  if (rd.y < -0.0004 && uCam.y > WAT){
    float d = (WAT - uCam.y) / rd.y;
    if (d > 0.4 && (hit < 0.0 || d < hit)) tw = d;
  }

  vec3 col;
  float dist;
  if (tw > 0.0){
    vec3 p = uCam + rd * tw;
    col = shadeWater(p, rd, uSun, uDusk);
    dist = tw;
  } else if (hit > 0.0){
    vec3 p = uCam + rd * hit;
    col = shadeGround(p, rd, hit, uSun, uDusk);
    dist = hit;
  } else {
    col = skyFull(rd, uSun, uDusk);
    dist = TMAX;
  }

  if (hit > 0.0 || tw > 0.0){
    float amt = 1.0 - exp(-dist * 0.0028);
    amt *= mix(1.00, 0.55, smoothstep(-5.0, 9.0, (uCam + rd * dist).y));
    col = mix(col, skyTone(rd, uDusk) + sunGlow(rd, uSun, uDusk), clamp(amt, 0.0, 1.0));
  }

  col *= 0.78 * uIntro;
  col = aces(col);
  col = pow(max(col, 0.0), vec3(0.4545));
  col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, 1.18);
  col *= clamp(1.0 - 0.30 * pow(length(uv * 1.35), 2.8), 0.0, 1.0);
  col += (hash21(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5) * 0.016;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader compile failed");
  return s;
}

let prog, U;
try {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link failed");
} catch (e){
  fail("shader error: " + e.message);
  return;
}

gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

U = {};
for (const n of ["uRes","uTime","uDusk","uIntro","uCam","uFwd","uRight","uUp","uSun"]) U[n] = gl.getUniformLocation(prog, n);

const F1 = 0.00390625;
const mod = (a, b) => a - b * Math.floor(a / b);
const fract = x => x - Math.floor(x);

function hash21(x, y){
  const ax = fract(x * 0.1031 + 0.107), ay = fract(y * 0.1031 + 0.107), az = ax;
  const d = ax * (ay + 33.33) + ay * (az + 33.33) + az * (ax + 33.33);
  return fract((ax + d + ay + d) * (az + d) * 0.001);
}

function vn(px, py, cells){
  const ix = Math.floor(px), iy = Math.floor(py);
  const fx = px - ix, fy = py - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = mod(ix, cells), y0 = mod(iy, cells);
  const x1 = mod(ix + 1, cells), y1 = mod(iy + 1, cells);
  const a = hash21(x0, y0), b = hash21(x1, y0), c = hash21(x0, y1), d = hash21(x1, y1);
  const ab = a + (b - a) * ux, cd = c + (d - c) * ux;
  return ab + (cd - ab) * uy;
}

const wrap = v => mod(v + 4096, 8192) - 4096;

function terrainH(x, z){
  let cx = wrap(x) * F1, cy = wrap(z) * F1;
  let h = vn(cx, cy, 32) * 12;
  let tx = -cy * 2, ty = cx * 2;
  h += vn(tx, ty, 64) * 7;
  cx = ty * 2; cy = -tx * 2;
  h += vn(cx, cy, 128) * 4.5;
  tx = -cy * 2; ty = cx * 2;
  h += vn(tx, ty, 256) * 2.4;
  return h - 6;
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const cam = {
  x: 0, z: 0, y: terrainH(0, 0) + 7, yaw: 0, pitch: -0.058,
  mx: 0, my: 0, mvx: 0, mvy: 0, tmx: 0, tmy: 0,
  speed: reduce ? 4.6 : 7.4, speedMul: 1, tSpeedMul: 1
};

let dpr = 1, dyn = 1, frameAvg = 16.7, tuneAt = 0, slowN = 0, fastN = 0;

function applySize(){
  const w = innerWidth, h = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  const maxScale = Math.min(1, Math.sqrt(2.2e6 / (w * h * dpr * dpr)));
  const s = Math.max(0.42, maxScale * dyn);
  const cw = Math.max(2, Math.round(w * dpr * s));
  const ch = Math.max(2, Math.round(h * dpr * s));
  if (canvas.width !== cw || canvas.height !== ch){
    canvas.width = cw;
    canvas.height = ch;
  }
}

function resize(){ applySize(); }

addEventListener("resize", resize);
addEventListener("orientationchange", resize);
applySize();

let tAcc = tSkip, intro = tSkip > 0 ? 1 : 0, last = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  const dtms = now - last;
  last = now;
  const dt = Math.min(0.05, Math.max(0, dtms / 1000));
  tAcc += dt;

  frameAvg += (dtms - frameAvg) * 0.08;
  if (now > 1600 && now - tuneAt > 500){
    tuneAt = now;
    if (frameAvg > 20){ slowN++; fastN = 0; } else if (frameAvg < 13.6){ fastN++; slowN = 0; }
    if (slowN >= 2 && dyn > 0.52){ dyn = Math.max(0.52, dyn * 0.88); slowN = 0; applySize(); }
    else if (fastN >= 4 && dyn < 1){ dyn = Math.min(1, dyn * 1.07); fastN = 0; applySize(); }
  }

  const dusk = duskForce !== null ? duskForce : 0.5 - 0.5 * Math.cos((tAcc + 10) * 0.03307);
  if (tSkip <= 0) intro = Math.min(1, Math.max(0, (tAcc - 0.12) / 2.2));
  const iEase = 1 - Math.pow(1 - intro, 3);

  const heading = 0.55 * Math.sin(tAcc * 0.0131) + 0.30 * Math.sin(tAcc * 0.0337 + 1.7) - 0.10 * Math.sin(tAcc * 0.083 + 0.5);
  const dirX = Math.sin(heading), dirZ = Math.cos(heading);
  const spd = cam.speed * (0.86 + 0.24 * Math.sin(tAcc * 0.27)) * cam.speedMul;
  cam.x += dirX * spd * dt;
  cam.z += dirZ * spd * dt;

  const g0 = terrainH(cam.x, cam.z) + 4.0;
  const g1 = terrainH(cam.x + dirX * 11, cam.z + dirZ * 11) + 4.9;
  const g2 = terrainH(cam.x + dirX * 24, cam.z + dirZ * 24) + 6.2;
  const target = Math.max(g0, g1, g2, -1.0);
  cam.y += (target - cam.y) * (1 - Math.exp(-dt * 2.2));

  const k = 34, c = 9.6;
  cam.mvx += ((cam.tmx - cam.mx) * k - cam.mvx * c) * dt; cam.mx += cam.mvx * dt;
  cam.mvy += ((cam.tmy - cam.my) * k - cam.mvy * c) * dt; cam.my += cam.mvy * dt;
  cam.speedMul += (cam.tSpeedMul - cam.speedMul) * (1 - Math.exp(-dt * 2.5));

  const bob = reduce ? 0 : 0.26 * Math.sin(tAcc * 0.61) + 0.13 * Math.sin(tAcc * 1.13 + 2.0);
  const bobR = reduce ? 0 : 0.016 * Math.sin(tAcc * 0.23 + 1.2);

  const yaw = heading - cam.mx * 0.34;
  const pitch = cam.pitch + bob * 0.004 - cam.my * 0.15 + Math.sin(tAcc * 0.17) * 0.006;
  const cp = Math.cos(pitch);
  let fx = Math.sin(yaw) * cp, fy = Math.sin(pitch), fz = Math.cos(yaw) * cp;
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, rz) || 1;
  rx /= rl; rz /= rl;
  let ux = -fx * fy, uy = fx * fx + fz * fz, uz = -fz * fy;
  const ul = Math.hypot(ux, uy, uz) || 1;
  ux /= ul; uy /= ul; uz /= ul;
  const cr = Math.cos(bobR), sr = Math.sin(bobR);
  const r2x = rx * cr + ux * sr, r2y = ry * cr + uy * sr, r2z = rz * cr + uz * sr;
  const u2x = ux * cr - rx * sr, u2y = uy * cr - ry * sr, u2z = uz * cr - rz * sr;

  const elev = 0.130 - 0.32 * dusk;
  const azx = 0.751, azz = 0.660;
  const ce = Math.cos(elev);
  const sx = azx * ce, sy = Math.sin(elev), sz = azz * ce;

  const cw = mod(cam.x + 4096, 8192) - 4096;
  const cwz = mod(cam.z + 4096, 8192) - 4096;

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, tAcc);
  gl.uniform1f(U.uDusk, dusk);
  gl.uniform1f(U.uIntro, iEase);
  gl.uniform3f(U.uCam, cw, cam.y + bob, cwz);
  gl.uniform3f(U.uFwd, fx, fy, fz);
  gl.uniform3f(U.uRight, r2x, r2y, r2z);
  gl.uniform3f(U.uUp, u2x, u2y, u2z);
  gl.uniform3f(U.uSun, sx, sy, sz);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (A.ctx && !document.hidden) A.mood(dusk);
}
requestAnimationFrame(frame);

let idleTimer = 0;
addEventListener("pointermove", e => {
  cam.tmx = (e.clientX / innerWidth - 0.5) * 2;
  cam.tmy = (e.clientY / innerHeight - 0.5) * 2;
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 2200);
}, {passive:true});

addEventListener("wheel", e => {
  cam.tSpeedMul = Math.min(2.6, Math.max(0.45, cam.tSpeedMul * Math.exp(-e.deltaY * 0.0013)));
}, {passive:true});

const A = {
  ctx: null, started: false, master: null, send: null, filter: null,
  chordIdx: 0, nextChord: 0, nextBell: 0, timer: 0, lastMood: 0, moodAt: 0,

  makeImpulse(dur, decay){
    const rate = this.ctx.sampleRate, n = Math.floor(rate * dur);
    const b = this.ctx.createBuffer(2, n, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = b.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < n; i++){
        lp += ((Math.random() * 2 - 1) - lp) * 0.34;
        d[i] = lp * Math.pow(1 - i / n, decay);
      }
    }
    return b;
  },

  noiseBuffer(){
    const rate = this.ctx.sampleRate, n = rate * 4;
    const b = this.ctx.createBuffer(1, n, rate);
    const d = b.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < n; i++){
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.11;
    }
    return b;
  },

  mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); },

  pad(semis, when, dur){
    const ctx = this.ctx;
    const g = ctx.createGain();
    const peak = 0.15;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(peak, when + 7);
    g.gain.setValueAtTime(peak, when + dur - 11);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    g.connect(this.filter);

    for (const s of semis){
      const f = this.mtof(s);
      for (const det of [-4, 4]){
        const o = ctx.createOscillator();
        o.type = "sine";
        o.frequency.value = f * Math.pow(2, det / 1200);
        const og = ctx.createGain();
        og.gain.value = 0.5 / semis.length;
        o.connect(og); og.connect(g);
        o.start(when); o.stop(when + dur + 0.3);
      }
    }
    setTimeout(() => { try { g.disconnect(); } catch(e){} }, (when - ctx.currentTime + dur + 1) * 1000);
  },

  bell(when){
    const ctx = this.ctx;
    const scale = [0, 3, 5, 7, 10, 12];
    const f = this.mtof(60 + scale[(Math.random() * scale.length) | 0] + (Math.random() < 0.35 ? 12 : 0));
    const dur = 3.5 + Math.random() * 3.5;
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    const out = pan || ctx.createGain();
    if (pan) pan.pan.value = (Math.random() * 2 - 1) * 0.72;
    out.connect(this.master);
    out.connect(this.send);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.05 + Math.random() * 0.05, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    g.connect(out);
    const o1 = ctx.createOscillator(); o1.type = "sine"; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2.006;
    const g2 = ctx.createGain(); g2.gain.value = 0.18;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(when); o2.start(when);
    o1.stop(when + dur + 0.1); o2.stop(when + dur + 0.1);
    setTimeout(() => { try { out.disconnect(); } catch(e){} }, (when - ctx.currentTime + dur + 1) * 1000);
  },

  schedule(){
    const ctx = this.ctx, now = ctx.currentTime;
    if (!this.nextChord) this.nextChord = now + 1.2;
    if (!this.nextBell) this.nextBell = now + 4.5;
    while (this.nextChord < now + 1.2){
      const t = Math.max(this.nextChord, now + 0.05);
      const chords = [
        [45, 52, 57, 60, 64],
        [41, 48, 53, 57, 60],
        [48, 55, 60, 64, 67],
        [43, 50, 55, 59, 62]
      ];
      this.pad(chords[this.chordIdx++ % chords.length], t, 42);
      this.nextChord = t + 21 + Math.random() * 6;
    }
    while (this.nextBell < now + 1.2){
      const t = Math.max(this.nextBell, now + 0.05);
      this.bell(t);
      const dens = 1 - 0.45 * this.lastMood;
      this.nextBell = t + (2.6 + Math.random() * 7.5) / dens;
    }
  },

  mood(dusk){
    this.lastMood = dusk;
    const now = this.ctx.currentTime;
    if (now - this.moodAt < 4) return;
    this.moodAt = now;
    this.filter.frequency.setTargetAtTime(620 - 240 * dusk, now, 6);
  },

  start(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;
    if (ctx.state === "suspended") ctx.resume();

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3;
    comp.attack.value = 0.02; comp.release.value = 0.4;
    comp.connect(ctx.destination);

    this.master = ctx.createGain();
    this.master.gain.value = 0.0001;
    this.master.connect(comp);

    const verb = ctx.createConvolver();
    verb.buffer = this.makeImpulse(3.8, 2.5);
    const wet = ctx.createGain();
    wet.gain.value = 0.5;
    verb.connect(wet); wet.connect(this.master);
    this.send = ctx.createGain();
    this.send.gain.value = 1;
    this.send.connect(verb);

    this.filter = ctx.createBiquadFilter();
    this.filter.type = "lowpass";
    this.filter.frequency.value = 620;
    this.filter.Q.value = 0.7;
    this.filter.connect(this.master);
    this.filter.connect(this.send);

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.043;
    const lg = ctx.createGain();
    lg.gain.value = 240;
    lfo.connect(lg); lg.connect(this.filter.frequency);
    lfo.start();

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuffer();
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.6;
    const wg = ctx.createGain(); wg.gain.value = 0.09;
    src.connect(lp); lp.connect(wg); wg.connect(this.master); wg.connect(this.send);
    src.start();

    this.master.gain.setTargetAtTime(0.55, ctx.currentTime + 0.15, 1.9);
    this.schedule();
    this.timer = setInterval(() => this.schedule(), 250);
  }
};

document.addEventListener("visibilitychange", () => {
  if (!A.ctx) return;
  A.master.gain.setTargetAtTime(document.hidden ? 0.0001 : 0.55, A.ctx.currentTime, document.hidden ? 0.35 : 0.9);
});

function begin(){
  if (A.started) return;
  A.started = true;
  document.body.classList.add("started");
  hint.classList.add("gone");
  setTimeout(() => hint.remove(), 700);
  try { A.start(); } catch (e){ console.warn("audio unavailable:", e); }
}
addEventListener("pointerdown", begin, {once:true});
addEventListener("keydown", begin, {once:true});
})();
</script>
</body>
</html>
