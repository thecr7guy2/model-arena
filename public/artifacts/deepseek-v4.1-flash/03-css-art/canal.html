<head>

<title>Amsterdam — Canal Houses at Night in the Rain</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(90% 90% at 50% 40%,#06090f,#010206 70%)}
.scene{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;background:#060a16;isolation:isolate}

.c1{left:-12%;top:0;width:58%;height:18%}
.c2{left:24%;top:-8%;width:52%;height:20%;opacity:.85;animation-duration:170s;animation-delay:-40s}
.c3{left:4%;top:14%;width:48%;height:15%;opacity:.55;animation-duration:200s;animation-delay:-90s}
@keyframes drift{from{transform:translateX(-2.5%)}to{transform:translateX(3.5%)}}
.moon{position:absolute;left:65%;top:6%;width:6.5%;aspect-ratio:1;border-radius:50%;

.skyline{position:absolute;inset:0;z-index:10}

.house{position:absolute;bottom:35%;left:calc(var(--x)*1%);width:calc(var(--w)*1%);height:calc(var(--h)*1%);z-index:1}
.house .roof,.house .body{position:absolute;left:0;right:0;background-color:var(--c);background-image:
 repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 6px),
 linear-gradient(200deg,rgba(150,180,255,.07),transparent 38%),
 linear-gradient(0deg,rgba(255,150,70,.10),transparent 42%),
 linear-gradient(0deg,rgba(0,0,0,.5),transparent 26%)}
.house .roof{top:0;height:15%;filter:drop-shadow(0 -1px 0 rgba(170,196,255,.22)) drop-shadow(1px -1px 0 rgba(255,180,110,.12))}
.house .body{top:15%;bottom:0;box-shadow:inset 1px 0 0 rgba(0,0,0,.5),inset -1px 0 0 rgba(160,190,255,.05)}
.g1 .roof{height:15%;clip-path:polygon(0 100%,0 68%,13% 68%,13% 50%,26% 50%,26% 32%,38% 32%,38% 15%,44% 15%,44% 0,56% 0,56% 15%,62% 15%,62% 32%,74% 32%,74% 50%,87% 50%,87% 68%,100% 68%,100% 100%)}
.g1 .body{top:15%}
.g2 .roof{height:20%;border-radius:50% 50% 0 0/100% 100% 0 0}
.g2 .body{top:20%}
.g3 .roof{height:19%;clip-path:polygon(0 100%,50% 0,100% 100%)}
.g3 .body{top:19%}
.g4 .roof{height:18%;clip-path:polygon(0 100%,0 60%,32% 60%,32% 26%,22% 26%,22% 0,78% 0,78% 26%,68% 26%,68% 60%,100% 60%,100% 100%)}
.g4 .body{top:18%}

.wins{position:absolute;left:15%;right:15%;top:9%;bottom:27%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10% 16%}

@keyframes flick{0%,100%{opacity:1}38%{opacity:1}40%{opacity:.72}42%{opacity:1}57%{opacity:.93}58%{opacity:1}76%{opacity:.8}78%{opacity:1}}

.shop::after{content:"";position:absolute;inset:0;background:

.quay{position:absolute;left:0;right:0;top:65%;height:3.5%;z-index:12;background-color:#080c14;background-image:

.quay::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:

.bollard{position:absolute;bottom:88%;width:.55%;height:2%;border-radius:45% 45% 0 0;background:#05070d;
 box-shadow:0 1px 0 rgba(150,180,255,.12)}

.mirror{position:absolute;inset:0;z-index:5;opacity:.8;filter:saturate(.92) brightness(1.02);
 -webkit-mask-image:linear-gradient(180deg,transparent 0 67.5%,rgba(0,0,0,.9) 69.5%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.26) 90%,rgba(0,0,0,.08) 100%);
 mask-image:linear-gradient(180deg,transparent 0 67.5%,rgba(0,0,0,.9) 69.5%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.26) 90%,rgba(0,0,0,.08) 100%)}
.mirror .skyline{transform-origin:0 0;transform:translateY(104.3%) scaleY(-.55);filter:blur(2.2px);
 animation:wobble 13s ease-in-out infinite}
@keyframes wobble{
 0%,100%{transform:translateY(104.3%) scaleY(-.55) skewX(0deg)}
 28%{transform:translateY(104.3%) scaleY(-.55) skewX(-.32deg)}
 56%{transform:translateY(104.3%) scaleY(-.55) skewX(.22deg)}
 82%{transform:translateY(104.3%) scaleY(-.55) skewX(-.1deg)}}

.water{position:absolute;left:0;right:0;top:68.5%;bottom:0;z-index:6;overflow:hidden;background:
 linear-gradient(180deg,rgba(12,20,38,.08),rgba(6,11,22,.5) 42%,rgba(3,6,12,.9) 100%),
 repeating-linear-gradient(0deg,rgba(150,185,240,.028) 0 1px,transparent 1px 7px)}
.shimmer{position:absolute;inset:-12% -20%;background-image:
 repeating-linear-gradient(90deg,rgba(255,185,115,.075) 0 2px,transparent 2px 12px),
 repeating-linear-gradient(90deg,rgba(170,200,255,.06) 0 1px,transparent 1px 12px),
 repeating-linear-gradient(90deg,rgba(255,200,140,.04) 0 3px,transparent 3px 37px);
 background-position:0 0,5px 0,17px 0;filter:blur(1.3px);animation:driftx 16s linear infinite}
@keyframes driftx{from{transform:translate3d(0,0,0)}to{transform:translate3d(-12px,0,0)}}
.seaglaze{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
 background:radial-gradient(60% 90% at 46% 100%,rgba(255,170,90,.10),rgba(255,140,70,.045) 45%,transparent 72%),
 radial-gradient(40% 70% at 84% 100%,rgba(140,175,235,.07),transparent 70%)}
.warmpool{position:absolute;left:0;top:10%;width:26%;height:48%;filter:blur(5px);

.bridge-reflect{position:absolute;left:-16%;top:54%;width:60%;height:50%;filter:blur(6px);background:

 radial-gradient(32% 90% at 78% 0%,rgba(2,4,8,.75),transparent 74%)}
.twinkle{position:absolute;left:0;right:0;top:0;height:18%;background-image:
 radial-gradient(circle,rgba(215,235,255,.5) 0 .7px,transparent 1.2px),
 radial-gradient(circle,rgba(255,215,170,.45) 0 .7px,transparent 1.2px);
 background-size:5.5% 32%,8.5% 44%;background-position:0 0,2.7% 14%;
 animation:tw 3.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:.65}}
.ripples{position:absolute;inset:0}
.ripples b{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:2.6%;height:.5%;margin:-.25% 0 0 -1.3%;

 animation:ripple 5.6s cubic-bezier(.25,.6,.45,1) infinite;animation-delay:var(--d)}
.ripples b.cool{border-color:rgba(180,210,255,.32)}
@keyframes ripple{0%{transform:scale(.25);opacity:0}10%{opacity:.5}60%{opacity:.16}100%{transform:scale(2.7);opacity:0}}

.bridge{position:absolute;left:-14%;top:52%;width:56%;height:34%;z-index:30;background-color:#060910;background-image:
 repeating-linear-gradient(0deg,rgba(0,0,0,.45) 0 1px,transparent 1px 7px),
 repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 13px),
 linear-gradient(180deg,#080c15,#04060c 45%,#03050a);
 border-radius:50% 50% 0 0/90% 90% 0 0;
 -webkit-mask-image:radial-gradient(ellipse 34% 62% at 43% 100%,transparent 0 64%,#000 67%);
 mask-image:radial-gradient(ellipse 34% 62% at 43% 100%,transparent 0 64%,#000 67%)}

.rail{position:absolute;inset:0;z-index:34;pointer-events:none}
.rail b{position:absolute;left:calc(var(--x)*1% - .22%);top:calc(var(--y)*1% - 2%);width:.45%;height:2.1%;
 border-radius:1px;background:linear-gradient(180deg,#05080e,#03050a)}
.handrail{position:absolute;left:-14%;top:52%;width:56%;height:34%;border-radius:50% 50% 0 0/90% 90% 0 0;
 box-shadow:inset 0 1px 0 rgba(255,205,150,.22),inset 0 9px 0 #04060b;transform:translateY(-5.9%)}

.lamp{position:absolute;left:3.4%;bottom:45.7%;width:1.7%;height:8.4%;z-index:29}
.post{position:absolute;left:44%;bottom:0;width:12%;height:78%;border-radius:2px;
 background:linear-gradient(90deg,#02040a,#060a12 60%,#02040a)}
.head{position:absolute;left:6%;bottom:72%;width:88%;height:26%;
 background:linear-gradient(180deg,#ffe1b0,#ffab52 45%,#d97a26);
 clip-path:polygon(50% 0,100% 34%,80% 100%,20% 100%,0 34%);
 filter:drop-shadow(0 0 6px rgba(255,190,110,.85)) drop-shadow(0 0 20px rgba(255,150,60,.5))}
.lampglow{position:absolute;left:50%;top:12%;width:820%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(255,195,125,.30),rgba(255,160,80,.10) 42%,transparent 70%);
 filter:blur(4px);animation:lampflick 9s ease-in-out infinite;z-index:-1}
@keyframes lampflick{
 0%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 46%{opacity:.86;transform:translate(-50%,-50%) scale(.975)}
 50%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 73%{opacity:.92}78%{opacity:1}}

.bike{position:absolute;left:6%;top:36.3%;width:14%;aspect-ratio:1.5;z-index:29;transform:rotate(-2deg);
 filter:drop-shadow(0 1px 0 rgba(255,185,115,.42)) drop-shadow(0 -1px 0 rgba(160,190,255,.34))}
.bike i{position:absolute;height:1.7%;min-height:1px;background:#04060b;border-radius:2px;transform-origin:0 50%}
.bike .wheel{position:absolute;width:41.3%;height:62%;border-radius:50%;border:2px solid #04060b;
 background:repeating-conic-gradient(from 0deg,rgba(150,175,215,.2) 0 .7deg,transparent .7deg 32deg)}
.bike .wheel::after{content:"";position:absolute;left:50%;top:50%;width:10%;aspect-ratio:1;transform:translate(-50%,-50%);
 border-radius:50%;background:#04060b}
.bike .wheel.rear{left:-1.1%;top:38%}
.bike .wheel.front{left:59.7%;top:38%}
.bike .fender{position:absolute;width:41.3%;height:62%;border-radius:50%;clip-path:inset(0 0 56% 0);
 box-shadow:inset 0 1px 0 rgba(175,205,255,.22),inset 0 4px 0 #04060b}
.bike .fender.rear{left:-1.1%;top:38%}
.bike .fender.front{left:59.7%;top:38%}
.bike .refl{position:absolute;width:2.6%;height:4%;border-radius:50%}
.bike .refl.f{left:77%;top:33%;background:rgba(255,245,225,.8);box-shadow:0 0 5px rgba(255,240,210,.75)}
.bike .refl.r{left:14%;top:33%;background:rgba(255,95,70,.8);box-shadow:0 0 5px rgba(255,90,60,.7)}
.bike .tt{left:32%;top:13.1%;width:40.1%;transform:rotate(-2.9deg)}
.bike .dt{left:43%;top:73.1%;width:41.8%;transform:rotate(-42.1deg)}

.bike .ss{left:32%;top:13.1%;width:38.7%;transform:rotate(108.7deg)}
.bike .fk{left:74%;top:31.1%;width:25.5%;transform:rotate(75.5deg)}
.bike .sm{left:72%;top:10.1%;width:3.4%;transform:rotate(-63.4deg)}
.bike .hb{left:67.5%;top:5.4%;width:11.6%;transform:rotate(5.3deg)}
.bike .sd{left:28.5%;top:11.4%;width:8.1%;height:2.7%;border-radius:40%;transform:rotate(-7.1deg)}
.bike .sp{left:32.5%;top:9.6%;width:2.6%;transform:rotate(-66.8deg)}
.bike .cr{left:43%;top:73.1%;width:4.6%;height:2.5%;transform:rotate(48deg)}
.bike .pd{left:45.2%;top:78.4%;width:4.8%;height:2.8%;transform:rotate(5deg)}
.bike .rk{left:11%;top:33.3%;width:16%;transform:rotate(-3.6deg)}
.bike .ch{left:39.4%;top:68.2%;width:7.4%;height:11%;border-radius:50%;background:#04060b;
 box-shadow:inset 0 0 0 1px rgba(170,200,255,.14)}

.mist{position:absolute;left:-10%;right:-10%;top:30%;height:45%;z-index:39;pointer-events:none;filter:blur(7px);
 background:linear-gradient(180deg,transparent,rgba(140,170,220,.05) 45%,rgba(140,170,220,.09) 60%,transparent)}
.haze{position:absolute;left:0;right:0;top:58%;height:16%;z-index:20;pointer-events:none;filter:blur(6px);
 background:linear-gradient(180deg,transparent,rgba(135,165,220,.07) 42%,rgba(135,165,220,.11) 55%,transparent)}

.rain{position:absolute;inset:-30%;z-index:40;pointer-events:none;transform:rotate(6.5deg)}
.rain i{position:absolute;inset:0;background-repeat:repeat;animation:fall var(--t) linear infinite;opacity:var(--o)}
.r1{--t:1.5s;--o:.48;--h:140px;background-image:
 radial-gradient(ellipse 1px 6px at 50% 50%,rgba(200,220,255,.9) 0 18%,rgba(200,220,255,.12) 62%,transparent 100%),
 radial-gradient(ellipse 1px 5px at 50% 50%,rgba(190,210,255,.8) 0 18%,rgba(190,210,255,.1) 62%,transparent 100%),

 background-size:70px 140px,55px 140px,86px 140px;background-position:0 0,23px 51px,61px 97px}
.r2{--t:1.05s;--o:.56;--h:180px;background-image:

 radial-gradient(ellipse 1.5px 9px at 50% 50%,rgba(255,225,195,.8) 0 16%,rgba(255,225,195,.12) 60%,transparent 100%),
 radial-gradient(ellipse 2px 12px at 50% 50%,rgba(215,232,255,.9) 0 16%,rgba(215,232,255,.12) 60%,transparent 100%);
 background-size:95px 180px,68px 180px,120px 180px;background-position:0 0,37px 63px,91px 121px}
.r3{--t:.78s;--o:.6;--h:260px;background-image:

 radial-gradient(ellipse 2px 16px at 50% 50%,rgba(255,228,200,.7) 0 14%,rgba(255,228,200,.12) 58%,transparent 100%),
 radial-gradient(ellipse 3px 24px at 50% 50%,rgba(208,226,255,.9) 0 14%,rgba(208,226,255,.14) 58%,transparent 100%);

 radial-gradient(ellipse 1px 34px at 50% 50%,rgba(210,228,255,.6) 0 12%,rgba(210,228,255,.08) 55%,transparent 100%);

 radial-gradient(118% 96% at 50% 46%,transparent 42%,rgba(1,3,9,.3) 72%,rgba(0,2,7,.62) 100%),
 linear-gradient(180deg,rgba(2,4,10,.35),transparent 16%)}

@media (prefers-reduced-motion:reduce){
 .rain i,.ripples b,.shimmer,.mirror .skyline,.lampglow,.wins i.flick,.cloud{animation:none}
 .rain{opacity:.45}

}
</style>
</head>
<body>
<div class="scene" role="img" aria-label="Amsterdam canal houses at night in the rain: tall narrow gabled houses with warm glowing windows, their reflections shimmering in the canal, rain falling, and a bicycle leaning against a bridge railing.">

  <div class="sky">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="moon"></div>
    <div class="moonwisp"></div>
  </div>

  <div class="skyline">
    <div class="spire"><i></i><i class="clk"></i></div>

    <div class="house g1" style="--x:-2;--w:8.5;--h:42;--c:#2c2026">
      <div class="roof"></div>
      <div class="body">
        <div class="wins"><i class="on"></i><i class="dim"></i><i class="on flick"></i><i></i><i class="dim"></i><i class="on curt"></i></div>
        <div class="door lit"></div>
      </div>
    </div>
    <div class="house g2" style="--x:6.3;--w:7.2;--h:47;--c:#3a2820">
      <div class="roof"></div>
      <div class="body">
        <div class="wins"><i class="on"></i><i class="on"></i><i class="on curt"></i><i class="dim"></i><i class="on"></i><i></i></div>
        <div class="door"></div>
      </div>
    </div>
    <div class="house g3" style="--x:13.5;--w:8;--h:40;--c:#262a30">
      <div class="roof"></div>
      <div class="body">
        <div class="wins"><i class="on"></i><i class="on flick"></i><i class="cool"></i><i class="dim"></i><i class="on"></i><i class="dim"></i></div>
        <div class="shop"></div>
      </div>
    </div>
    <div class="house g1" style="--x:21.5;--w:7.5;--h:49;--c:#3d2b24">
      <div class="roof"></div>
