<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican riding a bicycle</title>

  <!-- Sky background -->
  <rect width="800" height="600" fill="#bfe3f7"/>

  <!-- Sun -->
  <circle cx="680" cy="90" r="50" fill="#ffd94d"/>

  <!-- Ground -->
  <rect x="0" y="460" width="800" height="140" fill="#8ac66a"/>
  <rect x="0" y="460" width="800" height="20" fill="#b7dd92"/>

  <!-- === BICYCLE === -->
  <!-- Rear wheel -->
  <circle cx="260" cy="440" r="95" fill="none" stroke="#333" stroke-width="10"/>
  <circle cx="260" cy="440" r="15" fill="#555"/>
  <!-- Rear spokes -->
  <g stroke="#666" stroke-width="4">
    <line x1="260" y1="345" x2="260" y2="535"/>
    <line x1="165" y1="440" x2="355" y2="440"/>
    <line x1="193" y1="373" x2="327" y2="507"/>
    <line x1="327" y1="373" x2="193" y2="507"/>
  </g>

  <!-- Front wheel -->
  <circle cx="545" cy="440" r="95" fill="none" stroke="#333" stroke-width="10"/>
  <circle cx="545" cy="440" r="15" fill="#555"/>
  <g stroke="#666" stroke-width="4">
    <line x1="545" y1="345" x2="545" y2="535"/>
    <line x1="450" y1="440" x2="640" y2="440"/>
    <line x1="478" y1="373" x2="612" y2="507"/>
    <line x1="612" y1="373" x2="478" y2="507"/>
  </g>

  <!-- Frame -->
  <g stroke="#d32f2f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Seat tube -->
    <line x1="260" y1="440" x2="330" y2="445"/>
    <!-- Top tube -->
    <line x1="330" y1="445" x2="330" y2="330"/>
    <!-- Bottom tube -->
    <line x1="330" y1="330" x2="545" y2="445"/>
    <!-- Down tube -->
    <line x1="330" y1="330" x2="260" y2="440"/>
    <!-- Fork -->
    <line x1="330" y1="330" x2="545" y2="345"/>
  </g>

  <!-- Seat -->
  <ellipse cx="330" cy="318" rx="38" ry="10" fill="#333"/>
  <!-- Seat post -->
  <line x1="330" y1="318" x2="330" y2="330" stroke="#333" stroke-width="8"/>

  <!-- Handlebars -->
  <g stroke="#333" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="560" y1="330" x2="560" y2="300"/>
    <path d="M 530 300 Q 560 290 590 300"/>
  </g>
  <!-- Handlebar grips -->
  <circle cx="530" cy="300" r="7" fill="#222"/>
  <circle cx="590" cy="300" r="7" fill="#222"/>

  <!-- Stem from fork to handlebars -->
  <line x1="545" y1="345" x2="560" y2="330" stroke="#333" stroke-width="8"/>

  <!-- Crank / pedals -->
  <circle cx="330" cy="445" r="22" fill="none" stroke="#555" stroke-width="8"/>
  <circle cx="330" cy="445" r="8" fill="#777"/>
  <!-- Pedals -->
  <rect x="355" y="450" width="22" height="8" rx="4" fill="#222" transform="rotate(30 366 454)"/>

  <!-- Chain ring -->
  <circle cx="330" cy="445" r="30" fill="none" stroke="#555" stroke-width="6"/>

  <!-- === PELICAN === -->
  <!-- Body -->
  <ellipse cx="330" cy="250" rx="70" ry="48" fill="#f5f2ec" stroke="#c9c4b8" stroke-width="3"/>

  <!-- Tail -->
  <path d="M 262 250 Q 225 265 218 245 Q 240 235 262 238 Z" fill="#e8e3d8" stroke="#c9c4b8" stroke-width="2"/>

  <!-- Wings -->
  <path d="M 300 225 Q 380 160 520 205 Q 460 255 380 258 Q 320 262 300 256 Z"
        fill="#fdfaf3" stroke="#c9c4b8" stroke-width="3"/>
  <path d="M 380 215 Q 470 178 515 205" fill="none" stroke="#d8d2c2" stroke-width="3"/>

  <!-- Neck -->
  <path d="M 360 225 Q 370 165 350 120 Q 340 92 315 78 Q 300 70 292 82 Q 285 95 300 105 Q 325 118 338 150 Q 352 185 352 240"
        fill="#fdfaf3" stroke="#c9c4b8" stroke-width="3"/>

  <!-- Head -->
  <circle cx="330" cy="80" r="36" fill="#fdfaf3" stroke="#c9c4b8" stroke-width="3"/>

  <!-- Eye -->
  <circle cx="315" cy="70" r="5" fill="#222"/>
  <circle cx="313" cy="68" r="1.8" fill="#fff"/>

  <!-- Beak (upper) -->
  <path d="M 296 78 Q 250 60 215 70 Q 205 72 206 78 Q 240 84 296 88 Z"
        fill="#f7b733" stroke="#d08a1a" stroke-width="2"/>

  <!-- Beak pouch (lower) -->
  <path d="M 296 88 Q 250 96 224 84 Q 235 128 300 96 Z"
        fill="#f7c95c" stroke="#d08a1a" stroke-width="2" opacity="0.9"/>

  <!-- Black wing tips -->
  <path d="M 470 205 Q 520 200 520 205 Q 500 225 470 220 Z" fill="#333"/>

  <!-- Legs -->
  <g stroke="#f7b733" stroke-width="8" stroke-linecap="round">
    <line x1="335" y1="290" x2="308" y2="330"/>
    <line x1="322" y1="340" x2="350" y2="445"/>
    <line x1="345" y1="290" x2="368" y2="330"/>
    <line x1="358" y1="340" x2="345" y2="445"/>
  </g>
  <!-- Feet / pedals -->
  <g fill="#d08a1a">
    <ellipse cx="350" cy="448" rx="14" ry="6" transform="rotate(20 350 448)"/>
    <ellipse cx="310" cy="448" rx="14" ry="6" transform="rotate(20 310 448)"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="120" r="30"/>
    <circle cx="150" cy="105" r="38"/>
    <circle cx="185" cy="120" r="30"/>
    <circle cx="520" cy="60" r="24"/>
    <circle cx="545" cy="50" r="30"/>
    <circle cx="570" cy="60" r="22"/>
  </g>
</svg>
