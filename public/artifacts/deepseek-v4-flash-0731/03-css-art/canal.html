<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amsterdam — rain on the canal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-inout: cubic-bezier(0.77, 0, 0.175, 1);
  --s: min(100vw / 1600, 100vh / 900);
}

html, body { height: 100%; }

body {
  background: #04060d;
  overflow: hidden;
  font-family: Georgia, 'Times New Roman', serif;
  -webkit-font-smoothing: antialiased;
}

.canvas {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1600px;
  height: 900px;
  margin-left: -800px;
  margin-top: -450px;
  transform: scale(var(--s));
  transform-origin: center center;
  background: linear-gradient(180deg, #050814 0%, #0a1026 34%, #131f3e 58%, #0d1526 64%, #0a0f1c 100%);
  overflow: hidden;
}

.scene { position: absolute; inset: 0; }

/* ---------------------------------------------------------------- sky */

@keyframes twinkle {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; }
}

.moon-halo {
  position: absolute;
  left: 120px; top: 40px;
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(180, 200, 255, 0.10) 0%, rgba(150, 175, 235, 0.05) 40%, transparent 68%);
  filter: blur(6px);
}
.moon {
  position: absolute;
  left: 205px; top: 92px;
  width: 96px; height: 96px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #f2f5ff 0%, #cfd8f2 55%, #aab6dc 100%);
  box-shadow:
    0 0 28px 12px rgba(205, 220, 255, 0.35),
    0 0 90px 40px rgba(160, 185, 245, 0.18);
  opacity: 0.92;
}
.moon::before, .moon::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(150, 160, 195, 0.45), rgba(150, 160, 195, 0.05) 70%);
}
.moon::before { width: 22px; height: 22px; left: 22px; top: 30px; }
.moon::after  { width: 14px; height: 14px; left: 58px; top: 54px; }

.clouds {
  position: absolute;
  left: 0; top: 60px;
  width: 1700px; height: 200px;
  background:
    radial-gradient(220px 60px at 18% 55%, rgba(28, 40, 70, 0.85), transparent 70%),
    radial-gradient(340px 80px at 42% 70%, rgba(22, 32, 60, 0.9), transparent 70%),
    radial-gradient(260px 70px at 62% 40%, rgba(26, 38, 68, 0.85), transparent 70%),
    radial-gradient(300px 80px at 86% 62%, rgba(20, 30, 56, 0.9), transparent 70%),
    radial-gradient(200px 55px at 100% 35%, rgba(28, 40, 72, 0.8), transparent 70%);
  filter: blur(24px);
  opacity: 0.9;
  animation: cloudDrift 48s ease-in-out infinite alternate;
}
@keyframes cloudDrift {
  from { transform: translateX(-60px); }
  to   { transform: translateX(90px); }
}

/* ---------------------------------------------------------------- houses */

.houses { position: absolute; inset: 0; z-index: 4; }

.house { position: absolute; bottom: 380px; }
.facade { position: absolute; inset: 0; overflow: visible; }

.house > .g  { position: absolute; left: 0; right: 0; box-shadow: inset 0 -8px 18px rgba(0,0,0,0.55); }

.gstep1  { clip-path: polygon(0 100%, 0 9%, 13% 9%, 13% 0, 27% 0, 27% 21%, 41% 21%, 41% 3%, 59% 3%, 59% 21%, 73% 21%, 73% 0, 87% 0, 87% 9%, 100% 9%, 100% 100%); }
.gstep2  { clip-path: polygon(0 100%, 0 8%, 14% 8%, 14% 0, 36% 0, 36% 20%, 50% 20%, 64% 20%, 64% 0, 86% 0, 86% 8%, 100% 8%, 100% 100%); }
.gpoint  { clip-path: polygon(0 100%, 0 18%, 50% 0, 100% 18%, 100% 100%); }
.gbell   { clip-path: polygon(0 100%, 0 28%, 3% 26%, 11% 16%, 21% 8%, 31% 2.5%, 50% 0, 69% 2.5%, 79% 8%, 89% 16%, 97% 26%, 100% 28%, 100% 100%); }
.gdouble { clip-path: polygon(0 100%, 0 8%, 12% 8%, 12% 0, 24% 0, 24% 22%, 40% 22%, 40% 0, 60% 0, 60% 22%, 76% 22%, 76% 0, 88% 0, 88% 8%, 100% 8%, 100% 100%); }

.house::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: -14px 0 26px -16px rgba(0,0,0,0.85), inset 0 0 60px rgba(0,0,0,0.35);
}
.facade::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,0,0,0.14) 38px 41px),
    repeating-linear-gradient(0deg, transparent 0 36px, rgba(0,0,0,0.10) 36px 39px);
  mix-blend-mode: multiply;
}

/* window */
.w {
  position: absolute;
  width: 34px; height: 48px;
  border-radius: 2px;
  border: 3px solid #0d0a07;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
}
.w::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 42%, rgba(255,255,255,0.05));
  border-radius: 1px;
}
.w::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(90deg, transparent 0 47%, rgba(20,12,6,0.55) 47% 53%, transparent 53%),
    linear-gradient(180deg, transparent 0 43%, rgba(20,12,6,0.5) 43% 49%, transparent 49% 72%, rgba(20,12,6,0.5) 72% 78%, transparent 78%);
}
.wlit {
  background: linear-gradient(180deg, #ffe1a0 0%, #f6b45c 55%, #df8b33 100%);
  box-shadow:
    0 0 6px 1px rgba(255, 192, 92, 0.8),
    0 0 26px 12px rgba(255, 162, 58, 0.34);
}
.wdim {
  background: linear-gradient(180deg, #d4ab72, #a0763f);
  box-shadow: 0 0 10px 4px rgba(196, 144, 62, 0.26);
}
.wdark {
  background: radial-gradient(130% 130% at 30% 22%, #332923, #15100c 62%);
  box-shadow: inset 0 0 7px rgba(0,0,0,0.7);
}
.wt { height: 66px; }
.wa { width: 24px; height: 30px; }
.wa::after {
  background:
    linear-gradient(90deg, transparent 0 46%, rgba(20,12,6,0.5) 46% 54%, transparent 54%),
    linear-gradient(180deg, transparent 55%, rgba(20,12,6,0.5) 55% 60%, transparent 60%);
}
.wp { width: 60px; height: 54px; }

.flick  { animation: flick 6s var(--ease-inout) infinite; }
.flick2 { animation: flick 9s var(--ease-inout) 3s infinite; }
.flick3 { animation: flick 5.5s var(--ease-inout) 1s infinite; }
@keyframes flick {
  0%, 100% { opacity: 1; }
  6%  { opacity: 0.55; }
  8%  { opacity: 0.9; }
  30% { opacity: 1; }
  37% { opacity: 0.72; }
  41% { opacity: 1; }
  68% { opacity: 0.9; }
  71% { opacity: 0.6; }
  75% { opacity: 1; }
}

.door {
  position: absolute;
  background: linear-gradient(90deg, #241304, #120801 55%, #1c0f04);
  border-radius: 3px 3px 0 0;
  border-left: 4px solid #0c0703;
  border-right: 4px solid #0c0703;
}
.door::before {
  content: "";
  position: absolute;
  left: 6px; right: 6px; top: 5px;
  height: 17px;
  background: linear-gradient(180deg, #ffe0a0, #efab54);
  border-radius: 4px 4px 9px 9px;
  box-shadow: 0 0 14px 5px rgba(255, 172, 76, 0.5);
}
.door::after {
  content: "";
  position: absolute;
  left: 50%; top: 5px; bottom: 5px;
  width: 1px;
  background: #170d04;
}

.hook {
  position: absolute;
  left: 50%;
  width: 9px; height: 30px;
  margin-left: -4px;
  background: linear-gradient(90deg, #07070b, #23232d 50%, #07070b);
  border-radius: 3px;
  z-index: 2;
}
.hook::after {
  content: "";
  position: absolute;
  left: -5px; top: -5px;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #5a5963, #14141a 68%);
  box-shadow: 0 2px 3px rgba(0,0,0,0.6);
}

/* individual houses — colour */
.h1 { left: 20px;  width: 150px; height: 330px; }
.h1 .g  { top: -96px;  height: 96px; }
.h2 { left: 176px; width: 138px; height: 268px; }
.h2 .g  { top: -110px; height: 110px; }
.h3 { left: 320px; width: 160px; height: 350px; }
.h3 .g  { top: -120px; height: 120px; }
.h4 { left: 486px; width: 148px; height: 296px; }
.h4 .g  { top: -90px;  height: 90px; }
.h5 { left: 640px; width: 150px; height: 264px; }
.h5 .g  { top: -105px; height: 105px; }
.h6 { left: 796px; width: 164px; height: 352px; }
.h6 .g  { top: -120px; height: 120px; }
.h7 { left: 966px; width: 150px; height: 298px; }
.h7 .g  { top: -110px; height: 110px; }
.h8 { left: 1122px; width: 162px; height: 324px; }
.h8 .g  { top: -105px; height: 105px; }

.h1 .g  { background: linear-gradient(180deg, #3a2326, #241318); }
.h1 .facade { background: linear-gradient(180deg, #3c2624 0%, #2c1a19 40%, #221312 100%); }
.h2 .g  { background: linear-gradient(180deg, #2d1720, #1b0d13); }
.h2 .facade { background: linear-gradient(180deg, #2e1a22 0%, #23131a 46%, #180d12 100%); }
.h3 .g  { background: linear-gradient(180deg, #3a2b1e, #26190f); }
.h3 .facade { background: linear-gradient(180deg, #3a2b22 0%, #2a1c16 44%, #1d130e 100%); }
.h4 .g  { background: linear-gradient(180deg, #332134, #1e1420); }
.h4 .facade { background: linear-gradient(180deg, #37242f 0%, #251720 46%, #191018 100%); }
.h5 .g  { background: linear-gradient(180deg, #3b2120, #241211); }
.h5 .facade { background: linear-gradient(180deg, #392521 0%, #281816 44%, #1b100f 100%); }
.h6 .g  { background: linear-gradient(180deg, #34233d, #1c1220); }
.h6 .facade { background: linear-gradient(180deg, #352536 0%, #271925 46%, #1a1119 100%); }
.h7 .g  { background: linear-gradient(180deg, #3a2b1e, #251910); }
.h7 .facade { background: linear-gradient(180deg, #3c2c24 0%, #2b1e17 44%, #1e1510 100%); }
.h8 .g  { background: linear-gradient(180deg, #2d1f26, #1b1217); }
.h8 .facade { background: linear-gradient(180deg, #35232a 0%, #251822 46%, #191118 100%); }

/* ---------------------------------------------------------------- water */

.water {
  position: absolute;
  left: 0; top: 520px; right: 0; bottom: 0;
  background: linear-gradient(180deg,
    #1c2a4c 0%,
    #16223f 9%,
    #101a33 30%,
    #0b1326 58%,
    #070d1c 82%,
    #050911 100%);
  z-index: 3;
}

.rf { position: absolute; top: 0; transform: scaleY(-1); filter: blur(1px); }
.rf::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 90px;
  background: linear-gradient(180deg, transparent 0%, rgba(255,174,82,0.30) 55%, rgba(255,150,56,0.42) 100%);
}

.rwall {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(9,12,24,0) 0%, rgba(22,30,54,0.42) 30%, rgba(30,40,68,0.55) 78%, rgba(36,48,80,0.6) 100%);
}
.rwall::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,0,0,0.18) 38px 41px);
}

.rwin {
  position: absolute;
  bottom: 4px;
  width: 46px;
  height: 150px;
  background: linear-gradient(180deg, rgba(255,190,100,0.08) 0%, rgba(255,175,80,0.85) 38%, rgba(255,150,55,1) 100%);
  filter: blur(3px);
  transform-origin: center bottom;
  animation: rshine 4s ease-in-out infinite alternate;
}
.rwin.rtall { height: 210px; }
.rwin.rshort { height: 90px; }
.rglow {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 34px;
  background: linear-gradient(180deg, transparent 0%, rgba(255,176,86,0.6) 55%, rgba(255,158,64,0.5) 100%);
  filter: blur(2px);
}
@keyframes rshine {
  from { transform: translateX(-3px) rotate(0deg); opacity: 0.75; }
  to   { transform: translateX(4px) rotate(1.2deg); opacity: 1; }
}

.refl-tint {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,220,160,0.06), transparent 12%, transparent 60%, rgba(2,4,10,0.55) 100%);
  z-index: 5;
  pointer-events: none;
}

.sheen {
  position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(130,175,255,0.05) 46%, rgba(200,235,255,0.09) 50%, rgba(130,175,255,0.05) 54%, transparent 70%);
  mix-blend-mode: screen;
  filter: blur(3px);
  z-index: 6;
  animation: sheenMove 9s var(--ease-inout) infinite alternate;
  pointer-events: none;
}
@keyframes sheenMove {
  from { transform: translateX(-70px) translateY(-4px); }
  to   { transform: translateX(70px) translateY(4px); }
}

.shimmer {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(190, 220, 255, 0.05) 22px 24px, transparent 24px 46px),
    repeating-linear-gradient(0deg, transparent 0 52px, rgba(255, 235, 205, 0.035) 52px 55px, transparent 55px 96px);
  mix-blend-mode: screen;
  z-index: 7;
  animation: shimmerMove 2.6s linear infinite;
  pointer-events: none;
}
@keyframes shimmerMove { from { transform: translateY(0); } to { transform: translateY(26px); } }

.rip {
  position: absolute;
  width: 190px; height: 16px;
  border: 1px solid rgba(185, 215, 255, 0.16);
  border-radius: 50%;
  bottom: 0;
  filter: blur(1px);
  animation: ripple 6s var(--ease-out) infinite;
  pointer-events: none;
}
@keyframes ripple {
  0%   { transform: scaleX(0.4) scaleY(1); opacity: 0; }
  30%  { opacity: 1; }
  100% { transform: scaleX(1.6) scaleY(1.6); opacity: 0; }
}

.lamp-pool {
  position: absolute;
  left: 1110px; top: 0;
  width: 480px; height: 84px;
  background: radial-gradient(50% 100% at 50% 0%, rgba(255, 186, 92, 0.4), transparent 72%);
  filter: blur(7px);
  z-index: 8;
  animation: poolPulse 5s var(--ease-inout) infinite;
  pointer-events: none;
}
@keyframes poolPulse {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}

/* ---------------------------------------------------------------- distance / quay */

.quay {
  position: absolute;
  left: 1290px; right: 0; top: 520px; bottom: 0;
  z-index: 6;
}
.quay-wall {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  background: linear-gradient(180deg, #14141b 0%, #0d0e14 55%, #07080c 100%);
}
.quay-wall::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 26px, rgba(0,0,0,0.4) 26px 28px);
}
.quay-wet {
  position: absolute;
  left: 0; right: 0; top: 0; height: 9px;
  background: linear-gradient(180deg, #3a4a6e 0%, rgba(58,74,110,0.1) 100%);
  filter: blur(1px);
}
.quay-glow {
  position: absolute;
  left: 70px; right: 0; top: 0; height: 120px;
  background: radial-gradient(62% 100% at 58% 0%, rgba(255, 180, 90, 0.3), transparent 72%);
  filter: blur(6px);
}

.railing { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 3; }
.rail-post {
  position: absolute;
  bottom: 0;
  width: 8px;
  height: 148px;
  background: linear-gradient(270deg, #0b0b10, #1c1d26 60%, #0b0b10);
  transform: translateX(-3px);
}
.rail-top, .rail-mid {
  position: absolute;
  left: 0; right: 0;
  height: 9px;
  background: linear-gradient(180deg, #22242e, #0b0c11);
  border-radius: 4px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.rail-top { top: -148px; }
.rail-mid { top: -76px; height: 6px; }

/* ---------------------------------------------------------------- bicycle */

.bike {
  position: absolute;
  left: 1290px; top: 408px;
  width: 224px; height: 124px;
  transform: rotate(6deg);
  transform-origin: 28px 120px;
  z-index: 7;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6))
          drop-shadow(-4px 0 8px rgba(255,180,110,0.38))
          drop-shadow(-8px 4px 16px rgba(255,150,60,0.16));
}
.bike .inner {
  position: absolute;
  left: 0; top: 0;
  width: 224px; height: 124px;
  transform: scale(1.32);
  transform-origin: 22px 118px;
}
.bike > i, .bike > b, .bike > .sdl { position: absolute; background: #0b0c12; border-radius: 2px; }
.bike i {
  height: 4px;
  box-shadow: 0 1px 1px rgba(255, 255, 255, 0.05);
}
.wheel {
  position: absolute;
  width: 52px; height: 52px;
  border: 4px solid #12141c;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px #07080d, 0 0 2px rgba(255, 190, 120, 0.18);
}
.wheel::before, .wheel::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  background: #12141c;
}
.wheel::before { width: 2px; height: 38px; margin: -19px 0 0 -1px; }
.wheel::after  { width: 38px; height: 2px; margin: -1px 0 0 -19px; }
.hub { position: absolute; width: 5px; height: 5px; background: #1a1b22; border-radius: 50%; }
.sdl { width: 30px; height: 7px; border-radius: 5px; background: linear-gradient(180deg, #181922, #0a0b10); }

/* ---------------------------------------------------------------- lamp */

.lamp { position: absolute; left: 1260px; top: 252px; width: 34px; height: 268px; z-index: 8; }
.lamp-pole {
  position: absolute;
  left: 11px; top: 0;
  width: 11px; height: 268px;
  background: linear-gradient(90deg, #0c0d13, #262832 48%, #0c0d13);
  border-radius: 3px;
}
.lamp-base {
  position: absolute; left: 4px; bottom: 0;
  width: 26px; height: 8px;
  background: linear-gradient(90deg, #0a0b10, #1c1d26 50%, #0a0b10);
  border-radius: 3px;
}
.lamp-arm {
  position: absolute;
  left: 10px; top: 24px;
  width: 44px; height: 6px;
  background: linear-gradient(180deg, #23252f, #0b0c11);
  transform: rotate(-6deg);
}
.lamp-head { position: absolute; left: 34px; top: 0; width: 58px; height: 58px; }
.lamp-cap {
  position: absolute;
  left: -4px; top: 0;
  width: 66px; height: 18px;
  background: linear-gradient(180deg, #171820, #0b0c11);
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.lamp-glass {
  position: absolute;
  left: 2px; top: 16px;
  width: 54px; height: 40px;
  border-radius: 4px 4px 6px 6px;
  background: radial-gradient(70% 75% at 50% 38%, #fff3cf 0%, #ffd47e 40%, #f0a03c 100%);
  box-shadow:
    0 0 12px 4px rgba(255, 200, 110, 0.85),
    0 0 46px 20px rgba(255, 170, 70, 0.42),
    0 0 120px 60px rgba(255, 160, 60, 0.15);
  animation: lampGlow 4.5s var(--ease-inout) infinite;
}
@keyframes lampGlow {
  0%, 100% { opacity: 1; }
  46% { opacity: 0.92; }
  49% { opacity: 1; }
  50% { opacity: 0.9; }
  53% { opacity: 1; }
}
.lamp-cone {
  position: absolute;
  left: -98px; top: 48px;
  width: 330px; height: 250px;
  background: linear-gradient(180deg, rgba(255, 196, 110, 0.18), rgba(255, 170, 70, 0.05) 55%, transparent 78%);
  clip-path: polygon(52% 0, 100% 100%, 4% 100%);
  filter: blur(3px);
  mix-blend-mode: screen;
  z-index: -1;
}

/* ---------------------------------------------------------------- mist */

.mist {
  position: absolute;
  left: 0; right: 0; top: 452px;
  height: 110px;
  background:
    linear-gradient(180deg, transparent 0%, rgba(130, 155, 200, 0.10) 45%, rgba(120, 145, 190, 0.06) 60%, transparent 100%);
  filter: blur(16px);
  z-index: 5;
  pointer-events: none;
  animation: mistMove 16s var(--ease-inout) infinite alternate;
}
@keyframes mistMove {
  from { transform: translateX(-34px) scaleX(1); }
  to   { transform: translateX(40px) scaleX(1.03); }
}

/* ---------------------------------------------------------------- rain */

.rain { position: absolute; inset: 0; z-index: 11; pointer-events: none; }
.rain .rot { position: absolute; inset: 0; transform: rotate(-8deg); }
.rain .layer { position: absolute; width: 2px; height: 2px; }
.rain .far  { animation: rainFall 1.35s linear infinite; }
.rain .mid  { animation: rainFall 0.85s linear infinite; }
.rain .near {
  animation: rainFall 0.55s linear infinite;
  filter: blur(1.8px);
}
@keyframes rainFall {
  from { transform: translateY(-900px); }
  to   { transform: translateY(900px); }
}
