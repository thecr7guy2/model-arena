<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AURELIA — an endless flight</title>
<style>
  :root{
    --ease-out:cubic-bezier(.23,1,.32,1);
    --ink:rgba(255,241,226,.85);
    --ink-dim:rgba(255,241,226,.42);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#090a12}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;cursor:pointer}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .ui{position:fixed;inset:0;pointer-events:none;color:var(--ink)}

  .fade{opacity:0;transform:translateY(8px) scale(.99);
        transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
  .fade.in{opacity:1;transform:none}

  .brand{position:absolute;top:30px;left:34px;line-height:1.5}
  .brand h1{font-size:13px;font-weight:500;letter-spacing:.42em;text-indent:.42em;
            text-shadow:0 1px 8px rgba(10,8,20,.35)}
  .brand p{font-size:10px;font-weight:400;letter-spacing:.3em;text-indent:.3em;
           color:var(--ink-dim);text-transform:uppercase;margin-top:6px;
           text-shadow:0 1px 6px rgba(10,8,20,.3)}

  .credit{position:absolute;bottom:26px;right:34px;font-size:9px;letter-spacing:.28em;
          text-indent:.28em;color:var(--ink-dim);text-transform:uppercase;text-align:right}

  .hint{position:absolute;bottom:26px;left:34px;font-size:10px;letter-spacing:.3em;
        text-indent:.3em;text-transform:uppercase;color:var(--ink-dim);
        transition:opacity .25s var(--ease-out)}
  .hint.off{opacity:0}
  @media (prefers-reduced-motion:no-preference){
    .hint.pulse{animation:breathe 4.2s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
  }

  #veil{position:fixed;inset:0;background:#000;pointer-events:none;
        transition:opacity 1.4s var(--ease-out)}
  #veil.gone{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="brand fade"><h1>A&nbsp;U&nbsp;R&nbsp;E&nbsp;L&nbsp;I&nbsp;A</h1><p>an endless flight westward</p></div>
  <div class="hint pulse fade">click anywhere for sound</div>
  <div class="credit fade">webgl &middot; webaudio &middot; infinite</div>
</div>
<div id="veil"></div>
<script>
"use strict";
(function(){
var canvas=document.getElementById("c");
var gl=canvas.getContext("webgl",{antialias:false,depth:false,stencil:false,alpha:false,powerPreference:"high-performance"});
if(!gl){document.body.innerHTML="<p style='color:#eee;padding:2em'>WebGL is not available in this browser.</p>";return;}

var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
var FS=[
"precision highp float;",
"uniform vec2 R;uniform vec3 CP;uniform mat3 CM;uniform vec3 SD;uniform float GT;uniform float DK;",
"#define WL 0.0",
"float h21(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.5);return fract(p.x*p.y);}",
"vec3 h33(vec3 p){p=fract(p*vec3(443.9,397.2,291.7));p+=dot(p,p.yzx+19.19);return fract(p.xyz*p.zxy);}",
"float vno(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
" return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}",
"float fbm(vec2 p){float a=.5,s=0.;mat2 m=mat2(1.6,1.2,-1.2,1.6);",
" for(int i=0;i<5;i++){s+=a*vno(p);p=m*p;a*=.5;}return s;}",

"float terr(vec2 p){",
" float h=(fbm(p*.045)-.5)*30.;",
" h+=(fbm(p*.16)-.5)*4.5;",
" h+=.9*sin(p.x*.012)*cos(p.y*.017);",
" return h;}",

"vec3 skyCol(vec3 rd,float stars){",
" float horizon=1.-clamp(abs(rd.y)*1.6,0.,1.);horizon=horizon*horizon;",
" vec3 zen=mix(vec3(.10,.16,.34),vec3(.04,.05,.16),DK);",
" vec3 hor=mix(vec3(1.05,.52,.24),vec3(.55,.22,.34),DK);",
" vec3 sky=mix(zen,hor,horizon);",
" float sa=max(dot(rd,SD),0.);",
" sky+=vec3(1.,.45,.15)*pow(sa,6.)*.35*(1.-DK*.4);",
" sky+=vec3(1.,.6,.3)*pow(sa,64.)*.5;",
" float sd=dot(rd,SD);",
" sky+=vec3(1.,.85,.6)*smoothstep(.9996,.99985,sd)*3.5;",
" if(rd.y>0.03){",
"   vec2 cuv=rd.xz*(60./(rd.y+.18))+CP.xz*.04+vec2(GT*.012,GT*.004);",
"   float cv=fbm(cuv*.5);",
"   float cd=smoothstep(.52,.78,cv)*smoothstep(.03,.3,rd.y);",
"   vec3 cc=mix(vec3(.85,.55,.45),vec3(.25,.22,.38),DK);",
"   cc=mix(cc,vec3(1.,.75,.5),pow(sa,3.)*.6);",
"   sky=mix(sky,cc,cd*.55);",
" }",
" if(stars>.5&&rd.y>0.){",
"   vec3 q=rd*140.;vec3 ip=floor(q);vec3 rp=h33(ip)-.5;",
"   float d=length(fract(q)-.5-rp*.7);",
"   float br=smoothstep(.9,.1,d);",
"   br*=step(.965,rp.x+.33);",
"   br*=.55+.45*sin(GT*2.+rp.y*40.);",
"   br*=smoothstep(.04,.3,rd.y)*DK;",
"   sky+=vec3(.9,.95,1.)*br*1.2;",
" }",
" return sky;}",

"float march(vec3 ro,vec3 rd,float tmax){",
" float t=0.;float lt=0.;float lh=0.;",
" for(int i=0;i<128;i++){",
"  vec3 p=ro+rd*t;",
"  if(p.y>28.&&rd.y>0.)return -1.;",
"  float h=terr(p.xz);",
"  if(p.y<h){",
"    for(int b=0;b<6;b++){",
"      float mt=(t+lt)*.5;vec3 mp=ro+rd*mt;",
"      if(mp.y<terr(mp.xz))t=mt;else lt=mt;",
"    }",
"    return (t+lt)*.5;",
"  }",
"  lt=t;lh=h;",
"  t+=max(.06,(p.y-h)*.42);",
"  if(t>tmax)break;",
" }",
" return -1.;}",
"vec3 norm(vec3 p,float t){",
" float e=.012+t*.0006;",
" vec2 k=vec2(e,0.);",
 " return normalize(vec3(terr(p.xz-k.xy)-terr(p.xz+k.xy),2.*e,terr(p.xz-k.yx)-terr(p.xz+k.yx)));}",

"void main(){",
" vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;",
" vec3 ro=CP;",
" vec3 rd=normalize(CM*vec3(uv,1.65));",
" float tw=-1.;",
" if(rd.y<-.001)tw=(WL-ro.y)/rd.y;",
" float tt=march(ro,rd,420.);",
" vec3 col;",
" float hitDist;",
" if(tt>0.&&(tw<0.||tt<tw)){",
"   vec3 p=ro+rd*tt;",
"   vec3 n=norm(p,tt);",
"   float dif=max(dot(n,SD),0.);",
"   float sunny=mix(1.15,.75,DK);",
"   vec3 sunC=mix(vec3(1.,.62,.32),vec3(.9,.35,.22),DK);",
"   float rocky=smoothstep(.82,.94,n.y);",
"   float snowy=smoothstep(11.,15.,p.y+n.y*2.);",
"   vec3 alb=mix(vec3(.14,.19,.10),vec3(.30,.27,.24),rocky);",
"   alb=mix(alb,vec3(.88,.84,.86),snowy*.9);",
"   alb=mix(alb,vec3(.10,.12,.07),(1.-rocky)*smoothstep(WL+1.2,WL+.2,p.y));",
"   float amb=.42+.35*n.y;",
"   vec3 skyamb=mix(vec3(.30,.38,.55),vec3(.16,.18,.34),DK);",
"   vec3 lc=alb*(sunC*dif*sunny+skyamb*amb);",
"   float spec=pow(max(dot(reflect(rd,n),SD),0.),24.)*dif*.25;",
"   lc+=sunC*spec;",
"   col=lc;hitDist=tt;",
" }else if(tw>0.){",
"   vec3 wp=ro+rd*tw;",
"   vec2 wu=wp.xz;",
"   vec2 wa=vec2(fbm(wu*.5+vec2(GT*.25,GT*.1))-.5)+vec2(0.,fbm(wu*.55+vec2(GT*.08,GT*.22)-3.7)-.5);",
"   vec3 wn=normalize(vec3(wa.x*.18,1.,wa.y*.18));",
"   vec3 rr=reflect(rd,wn);rr.y=abs(rr.y);",
"   vec3 rc=skyCol(rr,0.);",
"   float fr=.045+.955*pow(1.-max(-rd.y,0.),5.);",
"   vec3 deep=mix(vec3(.02,.09,.11),vec3(.01,.03,.07),DK);",
"   vec3 wc=mix(deep,rc,mix(.35,.92,fr));",
"   wc+=vec3(1.,.7,.4)*pow(max(dot(rr,SD),0.),380.)*4.*(1.-DK*.5);",
"   col=wc;hitDist=tw;",
" }else{",
"   col=skyCol(rd,1.);hitDist=300.;",
" }",
" float sunAmt=pow(max(dot(rd,SD),0.),4.);",
" vec3 haze=mix(vec3(.9,.6,.42),vec3(.38,.24,.38),DK);",
" haze=mix(haze,vec3(1.,.78,.5),sunAmt*.8);",
" float fog=1.-exp(-hitDist*hitDist*.00006);",
" fog*=smoothstep(0.,.25,ro.y*rd.y+hitDist*.004+.15);",
" col=mix(col,haze,fog*.95);",
" col*=1.-.28*dot(uv*.62,uv*.62);",
" col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);",
" col=pow(clamp(col,0.,1.),vec3(.4545));",
" col+=(h21(gl_FragCoord.xy+fract(GT)*7.)-.5)*.012;",
" gl_FragColor=vec4(col,1.);}"
].join("\n");

function mk(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
var prog=gl.createProgram();
gl.attachShader(prog,mk(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var U={};
["R","CP","CM","SD","GT","DK"].forEach(function(n){U[n]=gl.getUniformLocation(prog,n);});

var reduced=false;
try{reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}

var resScale=Math.min(devicePixelRatio||1,2)>1?0.85:1;
var MAXPX=2100000;
function resize(){
  var dpr=Math.min(devicePixelRatio||1,2);
  var w=innerWidth*dpr*resScale,h=innerHeight*dpr*resScale;
  if(w*h>MAXPX){var k=Math.sqrt(MAXPX/(w*h));w*=k;h*=k;}
  canvas.width=w|0;canvas.height=h|0;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize);resize();

var CYCLE=280,SPEED=9;
function terrainJS(x,z){
  function h21(p){p=[p[0]%127.1/1,p[1]%311.7/1];
    var v=Math.sin(p[0]*127.1+p[1]*311.7)*43758.5453;return v-Math.floor(v);}
  function vno(p){var i=[Math.floor(p[0]),Math.floor(p[1])],f=[p[0]-i[0],p[1]-i[1]];
    f=[f[0]*f[0]*(3-2*f[0]),f[1]*f[1]*(3-2*f[1])];
    var a=h21(i),b=h21([i[0]+1,i[1]]),c=h21([i[0],i[1]+1]),d=h21([i[0]+1,i[1]+1]);
    return a+(b-a)*f[0]+(c-a)*f[1]+(a-b-c+d)*f[0]*f[1];}
  var s=0,a=.5,px=x*.045,pz=z*.045,nz;
  for(var o=0;o<5;o++){s+=a*vno([px,pz]);var nx=px*1.6+pz*1.2;nz=pz*-1.2+px*1.6;px=nx;pz=nz;a*=.5;}
  var s2=0;a=.5;px=x*.16;pz=z*.16;
  for(o=0;o<5;o++){s2+=a*vno([px,pz]);nx=px*1.6+pz*1.2;nz=pz*-1.2+px*1.6;px=nx;pz=nz;a*=.5;}
  return ((s-.5)*30+(s2-.5)*4.5+.9*Math.sin(x*.012)*Math.cos(z*.017));
}

var hy=null,yawSm=0,pitchSm=-0.06,rollSm=0;
var last=performance.now(),gtime=0,ftEMA=16.6;

function frame(now){
  var dt=Math.min((now-last)/1000,0.05);last=now;
  gtime+=dt;
  ftEMA=ftEMA*0.95+(dt*1000)*0.05;
  if(ftEMA>20&&resScale>0.55){resScale*=0.93;resize();ftEMA=16.6;}
  else if(ftEMA<13.5&&resScale<(Math.min(devicePixelRatio||1,2)>1?0.95:1.15)){resScale*=1.015;resize();ftEMA=16.6;}

  var px=gtime*0.021,pz=gtime*SPEED;
  var x=2.4*Math.sin(px)+1.1*Math.sin(gtime*0.047),z=pz;
  var pxp=(gtime-0.01)*0.021,pzp=(gtime-0.01)*SPEED;
  var xp=2.4*Math.sin(pxp)+1.1*Math.sin((gtime-0.01)*0.047),zp=pzp;
  var yaw=Math.atan2(x-xp,z-zp);
  var dy=yaw-yawSm;yawSm+=dy*(1-Math.exp(-dt*1.4));

  var ground=terrainJS(x,z);
  var targetY=ground+5.2+(reduced?0:0.35*Math.sin(gtime*0.5));
  if(hy===null)hy=targetY;
  hy+=(targetY-hy)*(1-Math.exp(-dt*2.0));
  if(hy<ground+2.2)hy=ground+2.2;

  var ahead=terrainJS(x+Math.sin(yawSm)*30,z+Math.cos(yawSm)*30);
  var pitch=-0.05+Math.max(-.12,Math.min(.14,(ground-ahead)*0.004));
  pitchSm+=(pitch-pitchSm)*(1-Math.exp(-dt*2.0));
  var rollT=reduced?0:(-(yaw-yawSm))*22+0.025*Math.sin(gtime*0.23);
  rollSm+=(rollT-rollSm)*(1-Math.exp(-dt*2.5));

  var el=0.30*Math.sin(gtime*2*Math.PI/CYCLE)-0.02;
  var az=0.35;
  var sd=[Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)];
  var dk=Math.max(0,Math.min(1,(0.20-el)/0.25));

  var cy=Math.cos(yawSm),sy=Math.sin(yawSm),cp=Math.cos(pitchSm),sp=Math.sin(pitchSm);
  var dir=[sy*cp,sp,cy*cp];
  var rt=[cy,0,-sy];
  var up=[rt[1]*dir[2]-rt[2]*dir[1],rt[2]*dir[0]-rt[0]*dir[2],rt[0]*dir[1]-rt[1]*dir[0]];
  var cr=Math.cos(rollSm),srn=Math.sin(rollSm);
  var R=[rt[0]*cr+up[0]*srn,rt[1]*cr+up[1]*srn,rt[2]*cr+up[2]*srn];
  var Uv=[up[0]*cr-rt[0]*srn,up[1]*cr-rt[1]*srn,up[2]*cr-rt[2]*srn];

  gl.uniform2f(U.R,canvas.width,canvas.height);
  gl.uniform3f(U.CP,x,hy,z);
  gl.uniformMatrix3fv(U.CM,false,[R[0],Uv[0],dir[0],R[1],Uv[1],dir[1],R[2],Uv[2],dir[2]]);
  gl.uniform3f(U.SD,sd[0],sd[1],sd[2]);
  gl.uniform1f(U.GT,gtime);
  gl.uniform1f(U.DK,dk);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

var actx=null,master=null,audioOn=false;
function midi(m){return 440*Math.pow(2,(m-69)/12);}
function initAudio(){
  if(audioOn)return;audioOn=true;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  var ctx=actx;
  master=ctx.createGain();master.gain.value=0;
  var comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-18;comp.ratio.value=6;
  master.connect(comp);comp.connect(ctx.destination);
  master.gain.setValueAtTime(0,ctx.currentTime);
  master.gain.linearRampToValueAtTime(0.8,ctx.currentTime+4);

  var rev=ctx.createDelay(1);rev.delayTime.value=0.38;
  var rev2=ctx.createDelay(1);rev2.delayTime.value=0.61;
  var fb=ctx.createGain();fb.gain.value=0.42;
  var lpf=ctx.createBiquadFilter();lpf.type="lowpass";lpf.frequency.value=1700;
  var revOut=ctx.createGain();revOut.gain.value=0.55;
  rev.connect(lpf);lpf.connect(fb);fb.connect(rev);
  lpf.connect(revOut);rev2.connect(revOut);revOut.connect(master);
  var send=ctx.createGain();send.gain.value=1;
  send.connect(rev);send.connect(rev2);

  var windBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  var wd=windBuf.getChannelData(0);
  for(var i=0;i<wd.length;i++)wd[i]=Math.random()*2-1;
  var wind=ctx.createBufferSource();wind.buffer=windBuf;wind.loop=true;
  var wbp=ctx.createBiquadFilter();wbp.type="bandpass";wbp.frequency.value=320;wbp.Q.value=0.6;
  var wg=ctx.createGain();wg.gain.value=0.035;
  var wlfo=ctx.createOscillator();wlfo.frequency.value=0.07;
  var wlg=ctx.createGain();wlg.gain.value=180;
  wlfo.connect(wlg);wlg.connect(wbp.frequency);
  wind.connect(wbp);wbp.connect(wg);wg.connect(master);
  wind.start();wlfo.start();

  var chords=[[45,52,59,64],[41,48,57,64],[48,55,59,62],[43,50,57,59]];
  var padLP=ctx.createBiquadFilter();padLP.type="lowpass";padLP.frequency.value=720;padLP.Q.value=0.4;
  var padG=ctx.createGain();padG.gain.value=0.11;
  padLP.connect(padG);padG.connect(send);padG.connect(master);
  var flfo=ctx.createOscillator();flfo.frequency.value=0.05;
  var flg=ctx.createGain();flg.gain.value=260;
  flfo.connect(flg);flg.connect(padLP.frequency);flfo.start();
  var padOsc=[];
  chords[0].forEach(function(m,i){
    var o=ctx.createOscillator();o.type="triangle";
    o.frequency.value=midi(m);
    var dl=ctx.createOscillator();dl.frequency.value=0.13+i*0.031;
    var dg=ctx.createGain();dg.gain.value=1.6;
    dl.connect(dg);dg.connect(o.detune);dl.start();
    o.connect(padLP);o.start();
    padOsc.push({o:o,i:i});
  });

  var chordIdx=0,startT=ctx.currentTime;
  var penta=[57,60,62,64,67,69,72,76];
  var nextNote=startT+2;
  setInterval(function(){
    if(ctx.state==="suspended")return;
    var ci=Math.floor((ctx.currentTime-startT)/9)%chords.length;
    if(ci!==chordIdx){chordIdx=ci;
      chords[chordIdx].forEach(function(m,i){
        if(padOsc[i])padOsc[i].o.frequency.setTargetAtTime(midi(m),ctx.currentTime,1.6);
      });
    }
    while(nextNote<ctx.currentTime+0.4){
      if(Math.random()<0.55){
        var nt=nextNote;
        var m=penta[(Math.random()*penta.length)|0]+(Math.random()<0.3?-12:0);
        var o=ctx.createOscillator();o.type="sine";o.frequency.value=midi(m);
        var g=ctx.createGain();
        g.gain.setValueAtTime(0,nt);
        g.gain.linearRampToValueAtTime(0.14,nt+0.012);
        g.gain.exponentialRampToValueAtTime(0.0004,nt+2.2+Math.random()*1.6);
        var pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
        if(pan){pan.pan.value=Math.random()*1.6-0.8;o.connect(g);g.connect(pan);pan.connect(send);pan.connect(master);}
        else{o.connect(g);g.connect(send);g.connect(master);}
        o.start(nt);o.stop(nt+4.2);
      }
      nextNote+=0.75+Math.random()*1.5;
    }
  },200);

  if(document.hidden)ctx.suspend();
}

var started=false;
function begin(){
  if(started)return;started=true;
  initAudio();
  var h=document.querySelector(".hint");
  h.classList.add("off");h.classList.remove("pulse");
}
addEventListener("pointerdown",begin);
addEventListener("keydown",function(e){
  if(e.key.toLowerCase()==="m"&&master){
    var now=actx.currentTime;
    master.gain.cancelScheduledValues(now);
    var target=master.gain.value>0.01?0:0.8;
    master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(target,now+0.15);
  }
});

document.addEventListener("visibilitychange",function(){
  if(!actx)return;
  if(document.hidden)actx.suspend();else if(audioOn)actx.resume();
});

requestAnimationFrame(function(){
  requestAnimationFrame(function(){
    document.getElementById("veil").classList.add("gone");
    var els=document.querySelectorAll(".fade");
    els.forEach(function(el,i){setTimeout(function(){el.classList.add("in");},120+i*90);});
  });
});
})();
</script>
</body>
</html>
